name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Ruff
        id: ruff
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version-file: requirements-dev.txt
          args: check --output-format github
      - name: Ruff ran the pinned version
        if: ${{ !cancelled() }}
        env:
          RUFF_RAN: ${{ steps.ruff.outputs.ruff-version }}
        run: |
          pinned=$(sed -n 's/^ruff==\([^[:space:]]*\).*/\1/p' requirements-dev.txt)
          if [ "$RUFF_RAN" != "$pinned" ]; then
            echo "::error::CI ran ruff '${RUFF_RAN}', but requirements-dev.txt pins ${pinned}"
            exit 1
          fi

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16.15@sha256:9e2cf6287f25c3151f4c9421ccce2b17f3e60061c111a29165e0d2cdd9ff0a97
        env:
          POSTGRES_USER: apply
          POSTGRES_PASSWORD: apply
          POSTGRES_DB: apply
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U apply"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: apply
      DB_USER: apply
      DB_PASSWORD: apply
      SECRET_KEY: ci-secret-key-not-for-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Migrate to head
        run: alembic upgrade head
      - name: Migrations round-trip (downgrade to base, upgrade again)
        run: |
          alembic downgrade base
          alembic upgrade head
          alembic check
      - name: Run tests
        run: pytest -q -n auto

  docker-build:
    name: Image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the shipped (final) stage
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: job-hunt:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The app user can't rewrite its own code, and the image has no psql.
      - name: Check the image's user and ownership
        run: |
          docker run --rm --entrypoint sh job-hunt:ci -c '
            set -e
            test "$(whoami)" = appuser || { echo "runs as $(whoami), not appuser"; exit 1; }
            test "$(stat -c %U /app)" = root || { echo "/app is not owned by root"; exit 1; }
            writable="$(find /app -writable -print -quit)"
            test -z "$writable" || { echo "appuser can write $writable"; exit 1; }
            if command -v psql; then echo "psql is in the image"; exit 1; fi
            echo "appuser, root-owned /app, nothing writable, no psql"
          '
      # Fails on a CRITICAL with a fix available; the table also lists fixable
      # HIGH and below without failing. Accepted findings go in .grype.yaml,
      # each with its reason. Same settings as release.yml's scan.
      - name: Scan the image
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: job-hunt:ci
          grype-version: v0.120.1
          only-fixed: true
          severity-cutoff: critical
          fail-build: true
          output-format: table
