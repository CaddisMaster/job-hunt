# Copied from Orbit Ops: a bare #N in these comments is an Orbit Ops issue.
# Job Hunt's layer of the shared droplet (#322). The host layer under it is
# droplet-infra's (infra/host-role.pin): this playbook never runs that role, so
# nothing here can change what the host or another tenant's site depends on.
- name: Job Hunt on the droplet
  hosts: droplet
  become: true
  roles:
    - job_hunt_app
