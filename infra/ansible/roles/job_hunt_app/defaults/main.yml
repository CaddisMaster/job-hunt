# Job Hunt's layer of the shared droplet, on top of droplet-infra's host role
# (infra/host-role.pin). Ported from Orbit Ops's orbit_ops_app (Orbit Ops #322).
# A test overrides only the deploy key.

job_hunt_dir: /opt/apply
job_hunt_user: deploy
job_hunt_domain: apply.seandesmet.com

# The restricted line release.yml deploys through (RUNBOOK §4). Only the public
# half is here, and it is Job Hunt's own key, not another tenant's; the private
# half is the DROPLET_SSH_KEY secret and nowhere else. Generated 2026-11-19. To
# rotate: a new key here and in the secret, then delete the old line on the
# droplet. Without a key the role stops at "The deploy key is set". Managed
# non-exclusively: every other line in the file (other tenants' keys, the
# backup-export key) is left as it is.
job_hunt_deploy_key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBuZhpyo7jFSYSs6Rj3hmfpoTAHH+EEZChQ2bqaVlJcU github-actions job-hunt deploy
job_hunt_deploy_key_options: no-agent-forwarding,no-port-forwarding,no-X11-forwarding
