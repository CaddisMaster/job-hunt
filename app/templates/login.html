{% extends "base.html" %}
{% block title %}Log in · Job Hunt{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Log in</h1>
  {% if error %}<p class="alert" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/login" class="stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">
    <label>Email <input name="email" type="email" autocomplete="username" required maxlength="254" autofocus></label>
    <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
    <button type="submit" class="primary">Log in</button>
  </form>
  <p class="muted">Job Hunt is invite only. Ask Sean for an invite.</p>
</section>
{% endblock %}
