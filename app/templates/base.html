<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  {# htmx injects an inline <style> unless told not to; style-src 'self' would block it. #}
  <meta name="htmx-config" content='{"includeIndicatorStyles": false}'>
  <title>{% block title %}Job Hunt{% endblock %}</title>
  <link rel="stylesheet" href="{{ static_url('css/style.css') }}">
  <script src="{{ static_url('htmx.min.js') }}" defer></script>
  {% block scripts %}{% endblock %}
</head>
<body hx-headers='{"X-CSRF-Token": "{{ csrf_token(request) }}"}'>
  <header class="topbar">
    <a class="brand" href="/">Job Hunt</a>
    {% if user %}
    <nav>
      <a href="/profile">Profile</a>
      {% if user.is_admin %}<a href="/admin">Admin</a>{% endif %}
      <span class="muted">{{ user.email }}</span>
      <form method="post" action="/logout" class="inline">
        <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">
        <button type="submit" class="link">Log out</button>
      </form>
    </nav>
    {% endif %}
  </header>
  <main class="container">
    {% set flash_message = pop_flash(request) %}
    {% if flash_message %}<p class="flash" role="status">{{ flash_message }}</p>{% endif %}
    {% block content %}{% endblock %}
  </main>
  <footer class="footer muted">
    {% if user %}{% include "_admin_notice.html" %}{% endif %}
    <p>{% if app_version != 'dev' %}v{% endif %}{{ app_version }}</p>
  </footer>
</body>
</html>
